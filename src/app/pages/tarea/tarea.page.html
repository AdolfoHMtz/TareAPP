<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Crear Tarea</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="primary"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="contenedor">
    <div class="encabezado">
      <h1>Crear Nueva Tarea</h1>
      <p>Completa la información para crear tu tarea</p>
    </div>

    <form [formGroup]="tareaForm" class="formulario">

      <div class="tarjeta">
        <div class="header-tarjeta">
          <h3>Información de la Tarea</h3>
        </div>

        <div class="contenido">
          <div class="campo">
            <ion-item>
              <ion-label position="stacked" color="primary">Nombre de la Tarea</ion-label>
              <ion-input
                formControlName="nombre"
                placeholder="Ingresa el nombre de la tarea">
              </ion-input>
            </ion-item>
            <div class="error" *ngIf="tareaForm.get('nombre')?.invalid && tareaForm.get('nombre')?.touched">
              <ion-text color="danger">
                <small>El nombre de la tarea es obligatorio</small>
              </ion-text>
            </div>
          </div>

          <div class="campo">
            <ion-item>
              <ion-label position="stacked" color="primary">Descripción</ion-label>
              <ion-textarea
                formControlName="descripcion"
                placeholder="Describe tu tarea"
                rows="3">
              </ion-textarea>
            </ion-item>
            <div class="error" *ngIf="tareaForm.get('descripcion')?.invalid && tareaForm.get('descripcion')?.touched">
              <ion-text color="danger">
                <small>La descripción de la tarea es obligatoria</small>
              </ion-text>
            </div>
          </div>

          <div class="campo">
            <ion-item>
              <ion-label position="stacked" color="primary">Fecha de Vencimiento</ion-label>
              <ion-input
                type="date"
                formControlName="fecha">
              </ion-input>
            </ion-item>
            <div class="error" *ngIf="tareaForm.get('fecha')?.invalid && tareaForm.get('fecha')?.touched">
              <ion-text color="danger">
                <small>La fecha de vencimiento es obligatoria</small>
              </ion-text>
            </div>
          </div>
        </div>
      </div>

      <div class="botones">
        <ion-button
          expand="block"
          color="primary"
          (click)="guardar()"
          [disabled]="tareaForm.invalid">
          Guardar Tarea
        </ion-button>

        <ion-button
          expand="block"
          fill="outline"
          color="medium"
          (click)="cancelar()">
          Cancelar
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
